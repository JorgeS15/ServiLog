services:
  servilog:
    image: ghcr.io/jorges15/servilog:latest
    container_name: servilog
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/tracker.db
      - PORT=4000
      # Uncomment and set a strong password to enable login protection.
      # Without this the app is open to anyone who can reach the port.
      - APP_PASSWORD=change-me
      # Uncomment if you are serving over HTTPS (adds the Secure flag to the session cookie).
      #- HTTPS=true
      # ── Email notifications (upcoming scheduled services) ──────────────────
      # Sends a reminder 7 days and 1 day before each scheduled service.
      # All four vars below must be set to enable notifications.
      #- SMTP_HOST=smtp.gmail.com
      #- SMTP_PORT=587
      #- SMTP_USER=you@gmail.com
      #- SMTP_PASS=your-app-password
      #- SMTP_FROM=ServiLog <you@gmail.com>
      #- NOTIFY_EMAIL=you@gmail.com
      #- NOTIFY_TIME=08:00
      #- SMTP_SECURE=false
    ports:
      - "4000:4000"
    # Explicit healthcheck (overrides whatever is baked into the image). Runs
    # inside the container, so it targets 127.0.0.1 on the app's own port — not
    # the host or any other container. If you change PORT above, change 4000 here too.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
